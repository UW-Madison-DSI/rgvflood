server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vector tiles (.pbf) are stored uncompressed and served as octet-stream
    gzip on;
    gzip_types application/octet-stream application/json application/javascript text/css;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Next.js build assets have content hashes in their names
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
