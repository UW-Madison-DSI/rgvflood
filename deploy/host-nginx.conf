# Host nginx reverse proxy in front of the rgvflood container.
# Install on the server as /etc/nginx/conf.d/rgvflood.conf, then run
# certbot --nginx, which adds the port 443 server and the http redirect
# to the installed copy.

server {
    listen 80;
    server_name sage-050798.cci.wisc.edu;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # The container only gzips responses to HTTP/1.1 requests,
        # and nginx proxies with HTTP/1.0 unless told otherwise.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
